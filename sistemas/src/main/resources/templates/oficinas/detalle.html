<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de oficina</title>
    <link rel="stylesheet" th:href="@{/oficinas/css/detalle.css}" href="/oficinas/css/detalle.css">
</head>
<body>
<header class="app-header">
    <nav class="nav-shell" aria-label="Navegaci&oacute;n principal">
        <a class="brand" th:href="@{/}" href="/">
            <span class="brand-mark">SI</span>
            <span>
                <strong>Gesti&oacute;n de Sistemas</strong>
                <small>Oficinas y sistemas inform&aacute;ticos</small>
            </span>
        </a>
        <div class="nav-links">
            <a th:href="@{/sistemas/listar}" href="/sistemas/listar">Sistemas</a>
            <a class="active" th:href="@{/oficinas/listar}" href="/oficinas/listar">Oficinas</a>
        </div>
    </nav>
</header>

<main class="page-shell narrow">
    <div class="page-title-row">
        <div>
            <p class="eyebrow">Detalle</p>
            <h1 th:text="${oficina.nombre}">Mesa de Entrada</h1>
        </div>
        <div class="title-actions">
            <a class="btn btn-secondary"
               th:href="@{/oficinas/editar/{id}(id=${oficina.id})}"
               href="/oficinas/editar/1">Editar</a>
            <a class="btn btn-ghost" th:href="@{/oficinas/listar}" href="/oficinas/listar">Volver</a>
        </div>
    </div>

    <section class="detail-card">
        <dl class="detail-grid">
            <div>
                <dt>ID</dt>
                <dd th:text="${oficina.id}">1</dd>
            </div>
            <div>
                <dt>Sistemas asociados</dt>
                <dd th:text="${oficina.sistemas != null ? #lists.size(oficina.sistemas) : 0}">3</dd>
            </div>
        </dl>

        <div class="related-list" th:if="${oficina.sistemas != null and !#lists.isEmpty(oficina.sistemas)}">
            <h2>Sistemas de la oficina</h2>
            <ul>
                <li th:each="sistema : ${oficina.sistemas}">
                    <a th:href="@{/sistemas/detalle/{id}(id=${sistema.id})}"
                       href="/sistemas/detalle/1"
                       th:text="${sistema.nombre}">Sistema de Inventario</a>
                    <span th:text="${sistema.anio}">2026</span>
                </li>
            </ul>
        </div>
    </section>
</main>

<footer class="app-footer">
    <p>UNPA 2026 | Laboratorio de Programacion | Silva Ramiro</p>
</footer>

<script th:src="@{/oficinas/js/detalle.js}" src="/oficinas/js/detalle.js"></script>
</body>
</html>
